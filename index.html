<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1510">
  <meta name="description" content="Maria — затишна кав’ярня. Меню, замовлення онлайн, відгуки.">
  <title>Maria — кав’ярня</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar__inner">
        <a href="#home" class="logo">Maria<span>coffee</span></a>
        <!-- навігація для комп'ютера; на телефоні — нижній таб-бар -->
        <nav class="topnav" aria-label="Основна навігація">
          <a href="#home" data-tab="home">Головна</a>
          <a href="#menu" data-tab="menu">Меню</a>
          <a href="#reviews" data-tab="reviews">Відгуки</a>
          <a href="#contacts" data-tab="contacts">Контакти</a>
        </nav>
        <div class="topbar__actions">
          <a href="#orders" class="topbar__btn" data-tab="orders" data-orders-link hidden aria-label="Мої замовлення" title="Мої замовлення">
            <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg>
            <span class="badge badge--dot" data-active-orders hidden></span>
          </a>
          <a href="#cart" class="topbar__btn topbar__cart" data-tab="cart" aria-label="Кошик" title="Кошик">
            <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
            <span class="badge" data-cart-count hidden>0</span>
          </a>
        </div>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Навігація">
      <a href="#home" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>
        <span>Головна</span>
      </a>
      <a href="#menu" data-tab="menu">
        <svg viewBox="0 0 24 24"><path d="M4 9h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6V9Z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3v3M12 3v3"/></svg>
        <span>Меню</span>
      </a>
      <a href="#cart" data-tab="cart">
        <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
        <span>Кошик</span>
        <span class="badge" data-cart-count hidden>0</span>
      </a>
      <a href="#reviews" data-tab="reviews">
        <svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8L12 3Z"/></svg>
        <span>Відгуки</span>
      </a>
      <a href="#contacts" data-tab="contacts">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span>Контакти</span>
      </a>
    </nav>

    <div class="sheet" id="sheet" aria-hidden="true">
      <div class="sheet__backdrop" data-close></div>
      <div class="sheet__panel" role="dialog" aria-modal="true">
        <div class="sheet__handle"></div>
        <button class="sheet__close" type="button" data-close aria-label="Закрити">✕</button>
        <div class="sheet__body" id="sheet-body"></div>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
